services:
  consul:
    image: consul:1.15
    container_name: consul
    ports:
      - "8500:8500"       # UI web de Consul
      - "8600:8600/udp"   # DNS interno
    command: agent -server -bootstrap -ui -client=0.0.0.0
    networks:
      - microservices-net

  # 1. El Servicio de Base de Datos
  mongodb:
    image: mongo:7.0.4
    container_name: mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=password
    volumes:
      - mongo_data:/data/db  # <--- ¡Aquí salvamos los datos!

  order-db:
    image: postgres:16-alpine
    container_name: order-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: order-db
    volumes:
      - order_data:/var/lib/postgresql/data

  product-service:
#    volumes:
#     - ./product-service/target:/app
    build: ./product-service              # Usa el Dockerfile de la carpeta actual
    container_name: product-service
    ports:
      - "8080:8080"
    environment:
      # Sobrescribimos la config de Spring para usar Docker
      # Fíjate: usamos 'mongodb' en lugar de 'localhost'
      - SPRING_DATA_MONGODB_URI=mongodb://root:password@mongodb:27017/product-db?authSource=admin
      - SPRING_APPLICATION_NAME=product-service
      - SPRING_CLOUD_CONSUL_HOST=consul
      - SPRING_CLOUD_CONSUL_PORT=8500
    depends_on:
      - mongodb         # Espera a que la BD arranque primero
      - consul
    networks:
      - microservices-net

  order-service:
    build: ./order-service
    container_name: order-service
    restart: always
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://order-db:5432/order-db
      - SPRING_DATASOURCE_USERNAME=admin
      - SPRING_DATASOURCE_PASSWORD=admin
      - SPRING_APPLICATION_NAME=order-service
      - SPRING_CLOUD_CONSUL_HOST=consul
      - SPRING_CLOUD_CONSUL_PORT=8500
    depends_on:
      - order-db
      - consul
    networks:
      - microservices-net

volumes:
      mongo_data:
      order_data:
networks:
  microservices-net:
    driver: bridge